<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="../INDEX/index.css"> -->
    <title>Fitness Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .form-container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            margin-bottom: 20%;
        }

        .heading h1 {
            font-weight: 500;
            font-size: 150px;
            background: linear-gradient(90deg, #FC466B 0%, #3F5EFB 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: 3s ease-in-out, -webkit-text-fill-color 3s ease-in-out;
            font-family: "Libre Baskerville", serif;
            text-align: center;

        }

        .heading h1:hover {
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #d4145a, #6a00f4);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(to right, #c0134e, #5800d4);
        }
    </style>
</head>

<body>
    <div class="heading">
        <h1>User Fitness Form</h1>
    </div>
    <form class="form-container">
        <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter your age" />
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" name="height" placeholder="Height in cm" />
            </div>
            <div class="form-group">
                <label>&nbsp;</label>
                <select>
                    <option>cm</option>
                    <option>feet</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" placeholder="Weight in kg" />
            </div>
            <div class="form-group">
                <label>&nbsp;</label>
                <select>
                    <option>Kg</option>
                    <option>lbs</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="bpm">Resting BPM:</label>
            <input type="number" id="bpm" min="40" max="100" required>
        </div>

        <div class="form-group">
            <label for="frequency">Workout Frequency:</label>
            <select id="frequency" name="frequency">
                <option>Select Frequency</option>
                <option>3 times/week</option>
                <option>4 times/week</option>
                <option>5 times/week</option>
            </select>
        </div>

        <div class="form-group">
            <label for="experience">Experience Level:</label>
            <select id="experience" name="experience">
                <option>Select Experience Level</option>
                <option>Beginner</option>
                <option>Intermediate</option>
                <option>Advanced</option>
            </select>
        </div>

        <button type="submit" class="submit-btn" onclick="window.location.href='Services.html'; return false;">SUBMIT</button>
        <button type="button" class="submit-btn" onclick="window.history.back();">Back</button>
    </form>

    <script src="Services.js"></script>

    
</body>

</html>
