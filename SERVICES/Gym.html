    <script>
    let map;

    function initMap() {
      // Default fallback position (center of India)
      const defaultPos = { lat: 20.5937, lng: 78.9629 };

      map = new google.maps.Map(document.getElementById("map"), {
        center: defaultPos,
        zoom: 5,
      });

      // Try HTML5 geolocation.
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const userPos = {
              lat: position.coords.latitude,
              lng: position.coords.longitude,
            };
            map.setCenter(userPos);
            map.setZoom(14);

            new google.maps.Marker({
              position: userPos,
              map,
              title: "You are here",
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 8,
                fillColor: "#007BFF",
                fillOpacity: 1,
                strokeWeight: 0,
              },
            });

            document.getElementById('status').textContent = "Searching for gyms nearby...";

            searchNearbyGyms(userPos);
          },
          () => {
            handleLocationError(true);
          }
        );
      } else {
        // Browser doesn't support Geolocation
        handleLocationError(false);
      }
    }

    function handleLocationError(browserHasGeolocation) {
      document.getElementById('status').textContent =
        browserHasGeolocation
          ? "Error: The Geolocation service failed. Showing default location."
          : "Error: Your browser doesn't support geolocation. Showing default location.";
      map.setCenter({ lat: 20.5937, lng: 78.9629 });
    }

    function searchNearbyGyms(location) {
      const service = new google.maps.places.PlacesService(map);
      const request = {
        location: location,
        radius: 5000, // in meters
        type: ["gym"],
      };

      service.nearbySearch(request, (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK) {
          results.forEach((place) => {
            createGymMarker(place);
          });
          document.getElementById('status').textContent = `Found ${results.length} gyms within 5 km.`;
        } else {
          document.getElementById('status').textContent = "No gyms found nearby.";
        }
      });
    }

    function createGymMarker(place) {
      const marker = new google.maps.Marker({
        map,
        position: place.geometry.location,
        title: place.name,
      });

      const infowindow = new google.maps.InfoWindow({
        content: `\n          <strong>${place.name}</strong><br>\n          ${place.vicinity || ""}\n        `,
      });

      marker.addListener("click", () => {
        infowindow.open(map, marker);
      });
    }
  </script>

  <!-- Replace YOUR_API_KEY with your actual Google Maps JavaScript API key -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&libraries=places">
