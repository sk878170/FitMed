<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: whitesmoke;
        color: white;
        padding: 30px;
      }
      .signup-container {
        background-color: #1c1e21;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
      }
      .btn-primary {
        background-color: #007bff;
        border: none;
      }
      .form-control {
        background-color: #2c2f33;
        color: white;
        border: 1px solid #444;
      }
      .form-control::placeholder {
        color: white;
        opacity: 1;
      }

      .mark{
        background-color: #1c1e21;
      }

      @media (max-width: 768px) {
        .signup-container {
          padding: 1.5rem;
          max-width: 90%;
        }
      }
      @media (max-width: 480px) {
        .signup-container {
          padding: 1rem;
          max-width: 95%;
        }
      }
    </style>
  </head>
  <body>
    <div class="signup-container text-center">
      <h2 class="mt-3">Sign Up</h2>
      <form onsubmit="validateForm(event)">
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            id="firstName"
            placeholder="First Name"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            id="lastName"
            placeholder="Last Name"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Email address"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      </form>
      <p>
        Already a user?
        <span><a href="../LOGIN/login_page.html">Login</a></span>
      </p>
      <div class="mark">
        <p class="mark">&copy; 2024-2025</p>
      </div>
      <button type="button" class="btn btn-secondary w-100" onclick="window.location.href='../INDEX/index.html'">Go Back to Home</button>
    </div>



    <script>
        function validateForm(event) {
          event.preventDefault();
  
          let firstName = document.getElementById("firstName").value;
          let lastName = document.getElementById("lastName").value;
          let email = document.getElementById("email").value;
          let password = document.getElementById("password").value;
  
          let nameRegex = /^[A-Za-z]+$/;
          let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          let passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
          let numberRegex = /[0-9]/;
  
          if (!nameRegex.test(firstName)) {
            alert("Please enter a valid name");
            return;
          }
  
          if (!nameRegex.test(lastName)) {
            alert("please enter a valid name");
            return;
          }
  
            if (!/^[a-z]{3}\d{3}@domain\.com$/.test(email)) { 
            alert("Please enter a valid email address in the format");
            return;
            }
  
          if (!passwordRegex.test(password)) {
            alert("Password must be at least 8 characters long and contain at least one letter, one number, and one special character.");
            return;
          }
  
          alert("Signup successful!");
        }
      </script>
  </body>
</html>
