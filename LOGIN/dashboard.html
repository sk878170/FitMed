<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FitMed Guide Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .dashboard {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: bold;
      color: #343a40;
    }
    .btn {
      margin: 10px 0;
      padding: 12px 20px;
      font-size: 16px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>Welcome to FitMed Guide</h1>
    <p>You have successfully logged in.</p>

    <button class="btn btn-primary" onclick="window.location.href='../services/services.html'">
      Go to Services
    </button>

    <button class="btn btn-secondary" onclick="window.location.href='../INDEX/index.html'">
      Go Back to Home
    </button>
  </div>
</body>
</html>
