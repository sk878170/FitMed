<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitMed Login Page</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>LOGIN</h1>
        <div class="login">
            <label for="login_email">Email:</label>
            <input type="text" id="login_email" name="login_email" placeholder="Enter your email">
            <label for="login_pw">Password:</label>
            <input type="password" id="login_pw" name="login_pw" placeholder="Enter your password">
        </div>
    </div>
</body>

</html>
