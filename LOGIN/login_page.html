<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Boldonse&family=Rancho&family=Sigmar&family=Stalinist+One&display=swap");

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: whitesmoke;
        color: white;
        padding: 20px;
      }
      .login-container {
        background-color: #1c1e21;
        padding: 3rem;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
      }
      .btn-primary {
        background-color: #007bff;
        border: none;
      }
      .form-control {
        background-color: #2c2f33;
        color: white;
        border: 1px solid #444;
        padding: 1rem;
      }
      .form-control::placeholder {
        color: white;
        opacity: 1;
      }
      .form-control:focus {
        background-color: white;
        color: black;
      }
      .form-control:focus::placeholder {
        color: black;
      }
      .login-container p {
        color: white;
        margin-top: 1.5rem;
      }
      h2 {
        font-family: "Stalinist One", sans-serif;
        margin-bottom: 2rem;
      }
      .mb-3 {
        margin-bottom: 1.5rem !important;
      }
      @media (max-width: 768px) {
        .login-container {
          padding: 2rem;
          max-width: 90%;
        }
      }
      @media (max-width: 480px) {
        .login-container {
          padding: 1.5rem;
          max-width: 95%;
        }
      }

      .error-msg {
        color: #ff4d4d;
        margin-bottom: 1rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="login-container text-center">
      <h2 class="mt-3">LOGIN</h2>

      <div id="errorMsg" class="error-msg"></div>

      <form id="loginForm">
        <div class="mb-3">
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Email address"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password"
            required
          />
        </div>
        <div class="form-check mb-3 text-start">
          <input type="checkbox" class="form-check-input" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
      <p style="text-align: center; margin-top: 10px;">
  <a href="../auth/forgot-password.html">Forgot Password?</a>
</p>

      <p>
        New to FitMed?
        <span><a href="../SIGN_UP/Sign_up_page.html">Sign Up</a></span>
      </p>

      <p>&copy; 2024-2025</p>
      <button
        type="button"
        class="btn btn-secondary w-100"
        onclick="window.location.href='../INDEX/index.html'"
      >
        Go Back to Home
      </button>
    </div>

    <!-- ✅ Script for login and token storage -->
    <script>
      const loginForm = document.getElementById("loginForm");
      const errorMsg = document.getElementById("errorMsg");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        errorMsg.textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        try {
          const res = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (!res.ok) {
            errorMsg.textContent = data.msg || "Login failed!";
            return;
          }

          // ✅ Save token in localStorage for other pages
         localStorage.setItem('token', data.token); // ✅ Save the token

          // ✅ Redirect to dashboard
          window.location.href = "dashboard.html";
        } catch (error) {
          errorMsg.textContent = "Network error. Please try again later.";
        }
      });
    </script>
  </body>
</html>
